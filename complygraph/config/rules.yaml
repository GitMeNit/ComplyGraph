# Declarative regulatory rules: law -> machine-checkable control.
# type: pattern          -> one finding per matching line
# type: cooccur_missing  -> file matches `pattern` but lacks `absent` (control missing next to risky code)
# type: project_missing  -> control `pattern` appears nowhere in project (evaluated only if `applies_if` matches)
version: "1.0"
defaults:
  files: ["*.py", "*.js", "*.ts", "*.java", "*.go", "*.yaml", "*.yml", "*.json", "*.md", "*.tf", "*.env"]
rules:
  - id: SEC-001
    title: Hardcoded credential or API key
    regulation: GDPR/DORA
    reference: "GDPR Art. 32; DORA Art. 9"
    severity: critical
    type: pattern
    pattern: "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(api[_-]?key|secret|token)\\s*[=:]\\s*[\"'][A-Za-z0-9_\\-]{16,}[\"'])"
    remediation: Move secrets to a vault (KMS/Secrets Manager), rotate the exposed credential, add pre-commit secret scanning.

  - id: GDPR-001
    title: Personal data written to logs
    regulation: GDPR
    reference: "GDPR Art. 5(1)(c), Art. 32"
    severity: high
    type: pattern
    pattern: "(?i)(log|logger|logging|print)\\w*(\\.\\w+)?\\(.*\\b(ssn|email|passport|iban|date_of_birth|dob|national_id|phone)\\b"
    remediation: Log opaque identifiers only; add a redaction filter to the logging pipeline.

  - id: GDPR-002
    title: Solely automated decision without human review path
    regulation: GDPR
    reference: "GDPR Art. 22; EU AI Act Art. 14"
    severity: high
    type: cooccur_missing
    pattern: "(?i)(auto_?approve|auto_?reject|automated_decision|loan_decision|credit_?score)"
    absent: "(?i)(human_review|human_in_the_loop|manual_review|escalate_to_human|four_eyes)"
    remediation: Add a human-intervention and contestation path for decisions with legal or similarly significant effect.

  - id: GDPR-003
    title: External AI API used without data-residency or transfer safeguards
    regulation: GDPR/DORA
    reference: "GDPR Art. 44-46; DORA Art. 28, 30"
    severity: high
    type: cooccur_missing
    pattern: "api\\.(openai|anthropic)\\.com"
    absent: "(?i)(data_residency|eu-west|eu-central|region\\s*=\\s*[\"']eu|dpa_ref|scc)"
    remediation: Pin an EU region or contractual transfer mechanism (SCCs/DPA), run a transfer impact assessment, record the provider in the DORA register of information.

  - id: GDPR-004
    title: No data retention or deletion control
    regulation: GDPR
    reference: "GDPR Art. 5(1)(e)"
    severity: medium
    type: project_missing
    applies_if: "(?i)(email|ssn|customer|personal_data|applicant)"
    pattern: "(?i)(retention|ttl|expire|purge|delete_after)"
    remediation: Define retention periods per purpose and implement automated deletion.

  - id: GDPR-005
    title: Insecure transport (TLS verification disabled or plain HTTP)
    regulation: GDPR/DORA
    reference: "GDPR Art. 32; DORA Art. 9"
    severity: high
    type: pattern
    pattern: "(verify\\s*=\\s*False|http://(?!localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0))"
    remediation: Enforce TLS 1.2+ with certificate verification on all network paths.

  - id: AIACT-001
    title: No automatic event logging for AI system
    regulation: EU AI Act
    reference: "EU AI Act Art. 12"
    severity: high
    type: project_missing
    applies_if: "(?i)(openai|anthropic|langchain|langgraph|sklearn|xgboost|torch|llama)"
    pattern: "(?i)(audit_log|audit_trail|AuditLog|structured_log)"
    remediation: Emit append-only, tamper-evident logs of inputs, outputs, model version and overrides.

  - id: AIACT-002
    title: No human oversight / approval mechanism for AI output
    regulation: EU AI Act
    reference: "EU AI Act Art. 14"
    severity: high
    type: project_missing
    applies_if: "(?i)(openai|anthropic|langchain|langgraph|sklearn|xgboost|torch|llama)"
    pattern: "(?i)(human_review|human_in_the_loop|approval|manual_review|interrupt\\()"
    remediation: Add a review/approve/override step and a stop control for consequential outputs.

  - id: AIACT-003
    title: Conversational AI without disclosure to the user
    regulation: EU AI Act
    reference: "EU AI Act Art. 50(1)"
    severity: medium
    type: cooccur_missing
    pattern: "(?i)(chatbot|chat_completion|ChatCompletion|messages\\.create)"
    absent: "(?i)(ai_disclosure|AI assistant|generated by AI|talking (to|with) an AI)"
    remediation: Show a clear notice that the user is interacting with an AI system.

  - id: AIACT-004
    title: High-impact scoring use case without bias / fairness testing
    regulation: EU AI Act
    reference: "EU AI Act Art. 10(2)(f)-(g), Annex III"
    severity: high
    type: project_missing
    applies_if: "(?i)(credit_?scor|loan|hiring|resume|candidate|underwrit)"
    pattern: "(?i)(fairness|bias|disparate_impact|demographic_parity)"
    remediation: Add bias examination of data and outputs across protected groups, with documented thresholds.

  - id: AIACT-005
    title: No model documentation (model card / technical documentation)
    regulation: EU AI Act/SR 11-7
    reference: "EU AI Act Art. 11; SR 11-7 documentation"
    severity: medium
    type: project_missing
    applies_if: "(?i)(sklearn|xgboost|torch|credit_?scor|model\\.fit|openai|anthropic)"
    pattern: "(?i)(model[ _-]?card|technical documentation|MODEL_CARD)"
    remediation: Maintain a model card covering purpose, data, metrics, limitations and change history.

  - id: DORA-001
    title: Outbound HTTP call without timeout
    regulation: DORA
    reference: "DORA Art. 9, Art. 11"
    severity: medium
    type: pattern
    files: ["*.py"]
    pattern: "requests\\.(get|post|put|delete|patch)\\((?![^)]*timeout)"
    remediation: Set explicit timeouts, retries with backoff and circuit breakers on all dependencies.

  - id: DORA-002
    title: No fallback or exit strategy for ICT third-party provider
    regulation: DORA
    reference: "DORA Art. 28(8)"
    severity: medium
    type: project_missing
    applies_if: "(?i)(openai|anthropic|azure|bedrock|vertex)"
    pattern: "(?i)(fallback|failover|circuit_breaker|exit_strategy|secondary_provider)"
    remediation: Implement provider abstraction with tested failover and a documented exit plan.

  - id: DORA-003
    title: No incident detection or escalation hook
    regulation: DORA/GDPR
    reference: "DORA Art. 17-19; GDPR Art. 33"
    severity: medium
    type: project_missing
    applies_if: "(?i)(def |function |class )"
    pattern: "(?i)(incident|pagerduty|opsgenie|alertmanager|notify_oncall)"
    remediation: Integrate incident classification and escalation so reporting clocks (DORA, GDPR 72h) can be met.

  - id: SR117-001
    title: No model validation / monitoring evidence
    regulation: SR 11-7
    reference: "SR 11-7 validation, ongoing monitoring"
    severity: high
    type: project_missing
    applies_if: "(?i)(sklearn|xgboost|torch|credit_?scor|scorecard|model\\.fit)"
    pattern: "(?i)(model_validation|backtest|back_test|challenger|drift|monitoring)"
    remediation: Establish independent validation, outcomes analysis/back-testing and drift monitoring.

  - id: NIST-001
    title: LLM application without prompt-injection / input guardrails
    regulation: NIST AI RMF/OWASP LLM
    reference: "NIST AI RMF Measure; OWASP LLM01"
    severity: medium
    type: project_missing
    applies_if: "(?i)(openai|anthropic|langchain|llama)"
    pattern: "(?i)(guardrail|prompt_injection|sanitize|moderation)"
    remediation: Add input/output guardrails, least-privilege tools and injection testing.
