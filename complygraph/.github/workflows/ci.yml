name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"            # offline mode: core tests need no heavy deps
      - run: ruff check src tests
      - run: pytest -q
  compliance-gate:                              # run ComplyGraph on your own repos as a PR check
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python -m complygraph.cli scan . --format sarif > complygraph.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: complygraph.sarif }
      - run: python -m complygraph.cli scan src --fail-on critical
